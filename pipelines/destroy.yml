# Pipeline manual que remove todo o ambiente (equivalente ao rollback do projeto AWS)
trigger: none
pr: none

parameters:
  - name: confirmacao
    displayName: 'Digite o nome do resource group para confirmar a exclusão'
    type: string
    default: ''

variables:
  azureServiceConnection: 'sc-estudo-azure'
  resourceGroup: 'rg-estudo-containerapps'

pool:
  vmImage: 'ubuntu-24.04'

steps:
  - task: AzureCLI@2
    displayName: 'Excluir resource group'
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e
        if [ "${{ parameters.confirmacao }}" != "$(resourceGroup)" ]; then
          echo "##vso[task.logissue type=error]Confirmação inválida: digite '$(resourceGroup)' para excluir."
          exit 1
        fi
        # Todos os recursos estão no mesmo resource group, então basta excluí-lo.
        # --no-wait: o Azure continua a exclusão em segundo plano e o pipeline termina na hora
        az group delete --name $(resourceGroup) --yes --no-wait
        echo "Exclusão de $(resourceGroup) iniciada. Acompanhe em: portal Azure -> Grupos de recursos."
        echo "Para conferir pelo Cloud Shell: az group exists -n $(resourceGroup)  (false = terminou)"
